global:
  scrape_interval: 5s

# Service chạy trên máy host khi dev (go run). Cổng quy ước:
# ingest 8080, query 8081, processor 8082, alert 8083
scrape_configs:
  - job_name: ingest
    static_configs: [{ targets: ["host.docker.internal:8080"] }]
  - job_name: query
    static_configs: [{ targets: ["host.docker.internal:8081"] }]
  - job_name: processor
    static_configs: [{ targets: ["host.docker.internal:8082"] }]
  - job_name: alert
    static_configs: [{ targets: ["host.docker.internal:8083"] }]
